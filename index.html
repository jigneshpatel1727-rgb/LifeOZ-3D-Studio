<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALL IN MY DAY 3D STUDIO</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">ALL IN MY DAY <span>3D STUDIO</span></div>
      <div class="workflow">CREATE → EDIT → MATERIAL → LIGHT → REALTIME → 360° → MEASURE → SAVE → EXPORT</div>
      <div class="top-actions">
        <button id="saveBtn">Save</button>
        <button id="loadBtn">Load</button>
        <button id="exportBtn">PNG</button>
      </div>
    </header>

    <aside class="left-panel">
      <h3>CREATE</h3>
      <button data-add="box">＋ Cube</button>
      <button data-add="sphere">＋ Sphere</button>
      <button data-add="cylinder">＋ Cylinder</button>
      <button data-add="plane">＋ Plane</button>
      <hr />
      <h3>EDIT</h3>
      <div class="tool-row">
        <button data-tool="move">Move</button>
        <button data-tool="rotate">Rotate</button>
        <button data-tool="scale">Scale</button>
      </div>
      <button id="deleteBtn" class="danger">Delete Selected</button>
      <hr />
      <h3>MATERIAL</h3>
      <label>Color <input id="color" type="color" value="#39d9ff"></label>
      <label>Metallic <input id="metallic" type="range" min="0" max="1" step="0.01" value="0.15"></label>
      <label>Roughness <input id="roughness" type="range" min="0" max="1" step="0.01" value="0.35"></label>
      <hr />
      <h3>LIGHT</h3>
      <label>Intensity <input id="lightIntensity" type="range" min="0" max="5" step="0.05" value="2"></label>
      <label>Environment <input id="envIntensity" type="range" min="0" max="2" step="0.05" value="0.8"></label>
    </aside>

    <main id="viewport">
      <div class="hud">
        <div id="selectionText">Nothing selected</div>
        <div id="statusText">Ready</div>
      </div>
      <div id="measureCard" class="measure-card hidden"></div>
      <div class="gizmo-help">Drag object • Shift+drag orbit • Wheel zoom • M/R/S tools</div>
    </main>

    <aside class="right-panel">
      <h3>MEASURE</h3>
      <div class="units">
        <button data-unit="mm">mm</button>
        <button data-unit="cm" class="active">cm</button>
        <button data-unit="m">m</button>
        <button data-unit="in">inch</button>
        <button data-unit="ft">feet</button>
      </div>
      <div id="dimensions">W — H — D —</div>
      <hr />
      <h3>PROJECT</h3>
      <button id="fitBtn">Fit View</button>
      <button id="resetBtn">Reset Scene</button>
      <button id="downloadProjectBtn">Download Project JSON</button>
      <input id="projectFile" type="file" accept=".json" hidden />
      <hr />
      <h3>PREVIEW</h3>
      <button id="orbitBtn">360° Orbit: ON</button>
    </aside>
  </div>
  <input id="loadInput" type="file" accept=".json" hidden />
  <script type="module" src="/src/main.js"></script>
</body>
</html>
